spring:
  datasource:
    username: postgres
    password: postgres
  modulith:
    republish-outstanding-events-on-restart: false

seed:
  savings:
    goal-visibility-window: PT1S  # tests that name goals which never exist expect them dropped at once; SavingsWebhookRetryIT sets its own
  jobs:
    enabled: false              # tests drive the inbox, reminders and COB explicitly
  security:
    dev-header-auth: true
    internal-token: test-internal-token-0123456789
  zapier:
    signing-secret: test-zapier-secret

logging:
  level:
    com.paypalseed: INFO
    org.springframework.modulith: WARN
