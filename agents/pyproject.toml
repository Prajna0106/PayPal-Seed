[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paypal-seed-agents"
version = "1.0.0"
description = "PayPal Seed Autonomous Agent Runtime & Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
seed-mcp = "seed_agents.mcp_server:main"
seed-agent-server = "seed_agents.server:main"
seed-agent-eval = "seed_agents.eval_harness:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seed_agents*"]
