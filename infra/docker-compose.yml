version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seed
      POSTGRES_PASSWORD: seed_password
      POSTGRES_DB: paypalseed
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
  seed-agents-mcp:
    build:
      context: ../agents
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - SEED_API_URL=http://host.docker.internal:8080
      - AGENT_RUNTIME_PORT=8090
      - SEED_MCP_TRANSPORT=http
