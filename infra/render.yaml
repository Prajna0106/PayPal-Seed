envVarGroups:
  # Shared by every backend role and both web apps.
  #   SEED_INTERNAL_TOKEN  the web servers call /internal/** with it (generated by Render)
  #
  # ONE MANUAL STEP after the first sync: SEED_ACTOR_TOKEN_SECRETS. Its value has the form `k1:<secret>` (a key id, a
  # colon, then 32 or more characters), and Render cannot generate a value with a fixed prefix. Open
  # Environment > Environment Groups > seed-shared and add SEED_ACTOR_TOKEN_SECRETS = k1:<output of `openssl rand -hex 32`>.
  # The member app signs member tokens with it and the backend verifies them, so it must be the same in all five
  # services; adding it to this group does that. Backend roles refuse to start without it outside dev, test and demo.
  # Staff tokens use the desk's own key instead (seed-desk below).
  # To rotate: put the new key in front, `k2:<new>,k1:<old>`, deploy the web apps and the backend, then drop k1 later.
  - name: seed-shared
    envVars:
      - key: SEED_INTERNAL_TOKEN
        generateValue: true
  # The api and the desk only, never the member app, so a break-in there can't reach staff accounts (ADR 0023):
  #   SEED_STAFF_SERVICE_TOKEN  the desk logs staff in and manages accounts with it (generated by Render)
  # ONE MANUAL STEP after the first sync: SEED_STAFF_ACTOR_TOKEN_SECRETS = d1:<output of `openssl rand -hex 32`>, in
  # Environment > Environment Groups > seed-desk. The desk signs staff tokens with it. It must differ from
  # SEED_ACTOR_TOKEN_SECRETS; the api refuses to start without it, or with a shared secret. Rotate it the same way.
  - name: seed-desk
    envVars:
      - key: SEED_STAFF_SERVICE_TOKEN
        generateValue: true
  # Backend roles only (the web apps never see these). Identical on every instance, which is what they need:
  #   SEED_RECORD_SIGNING_SECRET  signs credit record share links
  #   SEED_DESK_QUERY_CURSOR_KEY  signs desk grid cursors, so a cursor made by one api instance works on another
  #   SEED_PAYMENTS_RECIPIENT_FINGERPRINT_KEY  keys the hash of a payout recipient that the fraud rule compares
  - name: seed-backend
    envVars:
      - key: SEED_RECORD_SIGNING_SECRET
        generateValue: true
      - key: SEED_DESK_QUERY_CURSOR_KEY
        generateValue: true
      - key: SEED_PAYMENTS_RECIPIENT_FINGERPRINT_KEY
        generateValue: true

services:
  # The api serves members, the desk and partners (Java 21 via Docker)
  - type: web
    name: seed-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SEED_ROLE
        value: api
      - fromGroup: seed-shared
      - fromGroup: seed-desk
      - fromGroup: seed-backend
      # Database: Render's internal connection string is postgres://; Spring needs the jdbc: form of the same host and
      # database, e.g. jdbc:postgresql://<internal host>:5432/<database>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        fromDatabase: { name: seed-postgres, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: seed-postgres, property: password }
      # Set by hand (secrets, or ids that PayPal creates).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SEED_PAYPAL_PRODUCT_ID
        sync: false # printed by POST /internal/paypal/catalog/bootstrap
      - key: SEED_PAYPAL_SAVINGS_PLAN_ID
        sync: false # same call
      - key: PAYPAL_LOAN_PLAN_ID
        sync: false # same call
      - key: SEED_SAVINGS_RETURN_URL
        sync: false # https://<member web>/app/savings/return
      - key: SEED_SAVINGS_CANCEL_URL
        sync: false # https://<member web>/app/savings/cancelled

  # The ingress receives PayPal webhooks (verify the signature, store, answer 200) and drains the inbox.
  - type: web
    name: seed-ingress
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SEED_ROLE
        value: ingress
      - fromGroup: seed-shared
      - fromGroup: seed-backend
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        fromDatabase: { name: seed-postgres, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: seed-postgres, property: password }
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SEED_PAYPAL_PRODUCT_ID
        sync: false
      - key: SEED_PAYPAL_SAVINGS_PLAN_ID
        sync: false
      - key: PAYPAL_LOAN_PLAN_ID
        sync: false

  # The worker runs the pollers, the close of business, the hardship scan and sweep and the credit record close.
  - type: worker
    name: seed-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SEED_ROLE
        value: worker
      - fromGroup: seed-shared
      - fromGroup: seed-backend
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        fromDatabase: { name: seed-postgres, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: seed-postgres, property: password }
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SEED_PAYPAL_PRODUCT_ID
        sync: false
      - key: SEED_PAYPAL_SAVINGS_PLAN_ID
        sync: false
      - key: PAYPAL_LOAN_PLAN_ID
        sync: false
      - key: SEED_SAVINGS_RETURN_URL
        sync: false
      - key: SEED_SAVINGS_CANCEL_URL
        sync: false

  # Autonomous Agent Runtime & Model Context Protocol (MCP) Server (Python, port 8090)
  - type: web
    name: seed-agents-mcp
    runtime: docker
    dockerfilePath: ./agents/Dockerfile
    dockerContext: ./agents
    healthCheckPath: /health
    envVars:
      - key: SEED_API_URL
        sync: false # https URL of seed-api
      - key: AGENT_RUNTIME_PORT
        value: "8090"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - fromGroup: seed-shared

  # Web apps: pnpm workspace in web/. They reach the backend server-side only (SEED_API_URL).
  - type: web
    name: seed-member-web
    runtime: node
    rootDir: web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @paypal-seed/member... build
    startCommand: pnpm --filter @paypal-seed/member exec next start --port $PORT
    healthCheckPath: /
    envVars:
      - key: SEED_API_URL
        sync: false # https URL of seed-api
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_DESK_URL
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false # PayPal sandbox client id; Pay now is hidden without it
      - key: APP_ORIGIN
        sync: false # this app's https URL; add {APP_ORIGIN}/api/auth/paypal/callback to the PayPal login app's return URLs
      - key: PAYPAL_LOGIN_CLIENT_ID
        sync: false # the login-only PayPal app, not the payments one
      - key: PAYPAL_LOGIN_CLIENT_SECRET
        sync: false
      # Sandbox by default; both must change together when going live.
      - key: PAYPAL_WEB_URL
        value: https://www.sandbox.paypal.com
      - key: PAYPAL_API_URL
        value: https://api-m.sandbox.paypal.com
      # SEED_DEMO_LOGIN=true turns on sign-in with no password. Set it only on a demo deployment.
      - fromGroup: seed-shared

  - type: web
    name: seed-desk-web
    runtime: node
    rootDir: web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @paypal-seed/desk... build
    startCommand: pnpm --filter @paypal-seed/desk exec next start --port $PORT
    healthCheckPath: /login
    envVars:
      - key: SEED_API_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - fromGroup: seed-shared
      - fromGroup: seed-desk

databases:
  - name: seed-postgres
    plan: basic-1gb
