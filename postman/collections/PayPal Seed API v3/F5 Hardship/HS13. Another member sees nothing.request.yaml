$kind: http-request
name: 'HS13. Another member sees nothing'
method: GET
url: '{{baseUrl}}/api/v1/loans/{{hardshipLoanId}}/hardship'
order: 13000
description: 'Another member''s loan answers 404, the same as a loan without a case.'
headers:
  - key: 'X-Seed-Member-Id'
    value: '{{$guid}}'
    description: 'A different member: must see nothing of this case.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', () => pm.response.to.have.status(404));
      pm.test('Problem type is hardship-no-open-offer', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().type).to.eql('https://problems.paypal-seed.dev/hardship-no-open-offer');
      });
