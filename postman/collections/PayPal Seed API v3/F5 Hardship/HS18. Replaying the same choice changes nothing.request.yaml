$kind: http-request
name: 'HS18. Replaying the same choice changes nothing'
method: POST
url: '{{baseUrl}}/api/v1/hardship/cases/{{hardshipCaseId}}/choice'
order: 18000
description: 'Same Idempotency-Key as HS17: the answer is the recorded choice, not a second one.'
headers:
  - key: 'X-Seed-Member-Id'
    value: '{{hardshipMemberId}}'
    description: 'Dev, test and demo profiles. Use actorToken for a signed token.'
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Idempotency-Key'
    value: '{{hardshipChoiceKey}}'
    description: 'One key per user action; reuse it only to replay the same request.'
body:
  type: json
  content: |-
    {
      "offerId": "{{hardshipOfferId}}",
      "optionId": "{{hardshipOptionBId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Same outcome as the first call', () => {
        pm.expect(body.optionLabel).to.eql('B');
        pm.expect(['PENDING_APPROVAL', 'APPROVED', 'APPLIED']).to.include(body.status);
      });
