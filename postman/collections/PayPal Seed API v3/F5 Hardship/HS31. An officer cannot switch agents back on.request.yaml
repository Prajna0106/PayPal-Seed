$kind: http-request
name: 'HS31. An officer cannot switch agents back on'
method: POST
url: '{{baseUrl}}/api/v1/desk/agents/kill-switch'
order: 31000
description: 'Moving to a less restrictive mode needs ADMIN.'
headers:
  - key: 'X-Seed-Staff-Id'
    value: '{{makerId}}'
    description: 'Dev, test and demo profiles. Use staffToken for a signed token.'
  - key: 'X-Seed-Staff-Roles'
    value: 'OFFICER'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "scope": "GLOBAL",
      "mode": "LIVE",
      "reason": "Postman run: officer tries to loosen"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 403', () => pm.response.to.have.status(403));
      pm.test('Problem type is kill-switch-up-needs-admin', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().type).to.eql('https://problems.paypal-seed.dev/kill-switch-up-needs-admin');
      });
