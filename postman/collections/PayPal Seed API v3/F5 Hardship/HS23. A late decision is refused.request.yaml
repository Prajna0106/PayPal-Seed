$kind: http-request
name: 'HS23. A late decision is refused'
method: POST
url: '{{baseUrl}}/api/v1/desk/hardship/cases/{{hardshipCaseId}}/decision'
order: 23000
description: 'The request is already approved, so a new decision (new Idempotency-Key) has nothing to decide.'
headers:
  - key: 'X-Seed-Staff-Id'
    value: '{{checkerId}}'
    description: 'Dev, test and demo profiles. Use staffToken for a signed token.'
  - key: 'X-Seed-Staff-Roles'
    value: 'CHECKER'
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Idempotency-Key'
    value: '{{$guid}}'
    description: 'One key per user action; reuse it only to replay the same request.'
body:
  type: json
  content: |-
    {
      "decision": "APPROVE",
      "reasonCode": "INCOME_DROP_VERIFIED",
      "evidenceViewedMs": 30000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', () => pm.response.to.have.status(409));
      pm.test('Problem type is hardship-not-awaiting-decision or approval-stale', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(['https://problems.paypal-seed.dev/hardship-not-awaiting-decision', 'https://problems.paypal-seed.dev/approval-stale']).to.include(pm.response.json().type);
      });
