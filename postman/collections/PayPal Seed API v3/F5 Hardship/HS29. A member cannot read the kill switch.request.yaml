$kind: http-request
name: 'HS29. A member cannot read the kill switch'
method: GET
url: '{{baseUrl}}/api/v1/desk/agents/kill-switch'
order: 29000
headers:
  - key: 'X-Seed-Member-Id'
    value: '{{hardshipMemberId}}'
    description: 'Dev, test and demo profiles. Use actorToken for a signed token.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 403', () => pm.response.to.have.status(403));
      pm.test('Problem is RFC 9457', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
