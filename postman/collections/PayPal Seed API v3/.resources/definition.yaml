$kind: collection
name: 'PayPal Seed API (v3)'
description: 'Git-native v3 collection for PayPal Seed. Currently holds the F5 hardship safety-net folder; the older folders live in seed-api-collection.json. Authentication: against a dev, test or demo backend the requests send X-Seed-Member-Id, X-Seed-Staff-Id and X-Seed-Staff-Roles. Against a deployed backend set actorToken (member) and staffToken (staff): the collection pre-request script then sends Authorization: Bearer instead. /internal/** routes always use internalToken.'
variables:
  - key: 'baseUrl'
    value: 'http://localhost:8080'
    description: 'Backend root'
  - key: 'makerId'
    value: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa'
    description: 'Staff id with role OFFICER'
  - key: 'checkerId'
    value: 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb'
    description: 'Staff id with role CHECKER'
  - key: 'adminId'
    value: 'cccccccc-cccc-cccc-cccc-cccccccccccc'
    description: 'Staff id with role ADMIN (kill switch back to a less restrictive mode)'
  - key: 'actorToken'
    value: ''
    description: 'Signed member actor token (deployed backends)'
  - key: 'staffToken'
    value: ''
    description: 'Signed staff actor token (deployed backends)'
  - key: 'internalToken'
    value: 'local-dev-internal-token'
    description: 'SEED_INTERNAL_TOKEN for /internal/**'
  - key: 'agentToken'
    value: ''
    description: 'Optional agent run token (seedagt_...) for HS33; leave empty to skip it'
  - key: 'hardshipMemberId'
    value: ''
    description: 'Set by HS01'
  - key: 'hardshipLoanId'
    value: ''
    description: 'Set by HS01'
  - key: 'hardshipDisbursementRef'
    value: ''
    description: 'Set by HS01'
  - key: 'hardshipDisbursedOn'
    value: ''
    description: 'Set by HS01 (wall-clock date)'
  - key: 'hardshipScanDate'
    value: ''
    description: 'Set by HS02: eight days before the first due date'
  - key: 'hardshipAdvanceDays'
    value: ''
    description: 'Set by HS02: days HS03 moves the demo clock'
  - key: 'hardshipIncomeBody'
    value: ''
    description: 'Set by HS02: JSON body of HS04'
  - key: 'hardshipCaseId'
    value: ''
    description: 'Set by HS08'
  - key: 'hardshipOfferId'
    value: ''
    description: 'Set by HS12, refreshed by HS16'
  - key: 'hardshipOfferRevision'
    value: ''
    description: 'Set by HS12, refreshed by HS16'
  - key: 'hardshipOptionBId'
    value: ''
    description: 'Set by HS12, refreshed by HS16'
  - key: 'hardshipStaleKey'
    value: ''
    description: 'Idempotency key of HS15'
  - key: 'hardshipChoiceKey'
    value: ''
    description: 'Idempotency key of HS17 and its replay HS18'
  - key: 'hardshipMakerKey'
    value: ''
    description: 'Idempotency key of HS20'
  - key: 'hardshipCheckerKey'
    value: ''
    description: 'Idempotency key of HS22'
  - key: 'hardshipCaseStatus'
    value: ''
    description: 'Set by HS24'
  - key: 'hardshipPriorMode'
    value: ''
    description: 'Set by HS28; HS34 restores it'
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      // Signed actor tokens when provided; otherwise the dev headers on each request stay as they are.
      const isStaff = pm.request.headers.has('X-Seed-Staff-Id');
      const isMember = pm.request.headers.has('X-Seed-Member-Id');
      const token = isStaff ? pm.variables.get('staffToken') : (isMember ? pm.variables.get('actorToken') : '');
      if (token) {
        pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        ['X-Seed-Member-Id', 'X-Seed-Staff-Id', 'X-Seed-Staff-Roles'].forEach(h => pm.request.headers.remove(h));
      }
