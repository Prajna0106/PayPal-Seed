openapi: 3.1.0
info:
  title: PayPal Seed Internal Jobs API
  version: 1.2.0
  description: |
    Idempotent backend triggers for Render Workflows and the worker role. Every route requires
    `Authorization: Bearer <SEED_INTERNAL_TOKEN>` (service role). Close of business runs business dates
    strictly in order (ADR 0007).
security:
  - serviceToken: []
paths:
  /internal/jobs/cob/{date}/start:
    post:
      summary: Start close of business for a date (returns the existing run if already started)
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: trigger, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: Run }
        '409': { description: cob-out-of-order (the previous date is not closed, or this is not the next date) }
        '422': { description: cob-in-the-future }
  /internal/jobs/cob/{date}/shards/{shard}:
    post:
      summary: Close up to maxLoans loans of one shard; call again until done
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: shard, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 63 } }
        - { name: maxLoans, in: query, schema: { type: integer, minimum: 1, maximum: 50000, default: 2000 } }
      responses:
        '200':
          description: Shard progress
          content:
            application/json:
              schema:
                type: object
                properties: { businessDate: { type: string, format: date }, shard: { type: integer }, done: { type: boolean },
                              processed: { type: integer }, skipped: { type: integer }, failed: { type: integer } }
  /internal/jobs/cob/{date}/finish:
    post:
      summary: Close loans skipped while locked; mark the run COMPLETED or DEGRADED
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: Run } }
  /internal/jobs/cob/catch-up:
    post:
      summary: Close every date after the last closed one up to `to` (default today), in order
      parameters: [ { name: to, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: Runs } }
  /internal/jobs/mandates/reconcile:
    post:
      summary: "Daily safety net: reconcile every active autopay mandate with its schedule (ADR 0005)"
      responses: { '200': { description: Number of loans queued } }
  /internal/loans/disbursed:
    post:
      summary: Register a disbursed loan (F2 hand-over); idempotent on disbursementRef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId, principalCents, instalmentCount, dueDay, disbursedOn, disbursementRef]
              properties:
                memberId: { type: string, format: uuid }
                principalCents: { type: integer, description: Whole dollars }
                instalmentCount: { type: integer, minimum: 1, maximum: 36 }
                dueDay: { type: integer, minimum: 1, maximum: 31 }
                disbursedOn: { type: string, format: date }
                disbursementRef: { type: string, maxLength: 128 }
      responses:
        '201':
          description: Loan summary (the same shape as LoanSummary in seed-api.yaml)
          content:
            application/json:
              schema:
                type: object
                required: [loanId, memberId, principalCents, outstandingCents, status]
                properties:
                  loanId: { type: string, format: uuid }
                  memberId: { type: string, format: uuid }
                  principalCents: { type: integer, format: int64 }
                  outstandingCents: { type: integer, format: int64 }
                  status: { type: string }
  /internal/loans/{loanId}/reschedules:
    post:
      summary: Apply an approved hardship option as a new schedule version (F5 governance calls this)
      parameters: [ { name: loanId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [primitive, approvalRef]
              properties:
                primitive: { type: string, enum: [MOVE_DATE, DEFER_TO_END, REAMORTIZE] }
                seq: { type: integer }
                days: { type: integer, minimum: 1, maximum: 14 }
                extraMonths: { type: integer, minimum: 1, maximum: 6 }
                approvalRef: { type: string, maxLength: 128 }
      responses:
        '200': { description: New schedule }
        '422': { description: A rescheduling rule refused the request (problem code names the rule) }
  /internal/jobs/hardship/scan:
    post:
      summary: Score one keyset page of one shard group and open hardship cases at LIKELY_MISS or above (F5)
      description: |
        Looks only at active loans whose oldest owed instalment is due in the next 10 days or is in grace.
        Idempotent per loan and scan date (one scorecard run per loan per day). Call again with `after = nextAfter`
        until `done`. The worker role runs the same job daily at 06:15 America/Los_Angeles (`seed.jobs.hardship-scan-cron`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shardGroup, shardCount]
              properties:
                businessDate: { type: string, format: date, description: Defaults to today }
                shardGroup: { type: integer, minimum: 0 }
                shardCount: { type: integer, minimum: 1, maximum: 64 }
                after: { type: string, format: uuid, description: Keyset cursor }
                limit: { type: integer, minimum: 1, maximum: 1000, default: 200 }
            example: { businessDate: '2027-03-10', shardGroup: 0, shardCount: 8, limit: 500 }
      responses:
        '200':
          description: Page result
          content:
            application/json:
              schema:
                type: object
                properties:
                  businessDate: { type: string, format: date }
                  scanned: { type: integer }
                  opened: { type: integer }
                  failed: { type: integer }
                  nextAfter: { type: [string, 'null'], format: uuid }
                  done: { type: boolean }
  /internal/jobs/hardship/sweep:
    post:
      summary: Fire due hardship case timers (agent deadline, offer reminder and expiry, hold check and expiry, SLA 50/80/breach)
      description: The worker role also runs it every 30 s (`seed.jobs.hardship-sweep-ms`). Each timer fires once.
      parameters: [ { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } } ]
      responses:
        '200': { description: Timers fired, content: { application/json: { schema: { type: object, properties: { fired: { type: integer } } } } } }
  /internal/jobs/governance/verify-audit-chain:
    post:
      summary: Recompute the governance audit hash chain end to end; a break is a Sev-1 alert
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  intact: { type: boolean }
                  entries: { type: integer }
                  firstBrokenSeq: { type: [integer, 'null'] }
  /internal/underwriting/members/{memberId}/income:
    put:
      summary: Seed consented weekly income for a member (demo and sandbox; F3 replaces it with PayPal Transaction Search)
      parameters: [ { name: memberId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent]
              properties:
                consent: { type: boolean, description: false revokes consent; income signals then never fire }
                usualPaydayDow: { type: integer, minimum: 1, maximum: 7, description: ISO day of week money usually arrives }
                weeks:
                  type: array
                  maxItems: 104
                  items:
                    type: object
                    required: [weekStart, inflowCents]
                    properties:
                      weekStart: { type: string, format: date }
                      inflowCents: { type: integer, minimum: 0 }
            example: { consent: true, usualPaydayDow: 5, weeks: [ { weekStart: '2026-12-09', inflowCents: 20000 }, { weekStart: '2027-02-10', inflowCents: 9600 } ] }
      responses:
        '200':
          description: The 13-week summary as of today, or no body when consent is revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeklyInflowCents: { type: array, items: { type: integer }, minItems: 13, maxItems: 13, description: Oldest first, ending yesterday }
                  usualPaydayDow: { type: [integer, 'null'] }
                  activeWeeks: { type: integer }
  /internal/demo-clock/advance:
    post:
      summary: Demo profile only. Move the shared business date forward
      parameters: [ { name: days, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 400 } } ]
      responses: { '200': { description: New business date } }
components:
  securitySchemes:
    serviceToken: { type: http, scheme: bearer }
